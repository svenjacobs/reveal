version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    assignees:
      - "svenjacobs"
    # Library dependency updates trigger a patch release and appear in the changelog
    # (release-please), unlike the chore(deps) updates of the demo app and GitHub Actions.
    commit-message:
      prefix: "fix(deps)"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "androidx.compose.compiler*"
        exclude-patterns:
          - "org.jetbrains.kotlinx*"
  - package-ecosystem: "gradle"
    directory: "/demo-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    assignees:
      - "svenjacobs"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "androidx.compose.compiler*"
        exclude-patterns:
          - "org.jetbrains.kotlinx*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    assignees:
      - "svenjacobs"
